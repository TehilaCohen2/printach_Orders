<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תקופת ההדמיה הסתיימה</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 50px 40px;
            max-width: 550px;
            width: 90%;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .title {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 30px;
            line-height: 1.3;
        }
        .divider {
            height: 3px;
            width: 70px;
            background-color: #2563eb;
            margin: 0 auto 30px auto;
            border-radius: 2px;
        }
        .footer-link {
            font-size: 1.25rem;
            font-weight: 600;
            color: #2563eb;
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #64748b;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">שימו לב תקופת ההדמיה הסתיימה</div>
        <div class="divider"></div>
        <a href="http://TEHILAUTO.COM" class="footer-link">TEHILAUTO.COM</a>
        <div class="subtitle">תהילה כהן האוטומציה שמאחורי ההצלחה</div>
    </div>
</body>
</html>
